name: Deploy to GitHub Pages

on:
  # 推送到 main 时自动构建并部署
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 每天 21:00 UTC（北京时间次日 05:00）重新构建一次，顺带刷新星标 / 阅读数据
  schedule:
    - cron: "0 21 * * *"

# 部署到 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 抓取 GitHub 星标 / 关注者数、CSDN 阅读数据，写入 content/ 与 lib/config.ts。
      # 带上 GITHUB_TOKEN：调用 GitHub API 时需要，否则共享 IP 容易被限流。
      # 外部站点可能限流，失败时保留上一次的数据，不让部署挂掉。
      - name: Refresh stats from GitHub & CSDN
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run sync-stats
        continue-on-error: true

      # 只设置这一个变量即可：basePath 会根据 GITHUB_REPOSITORY 自动推导为 /仓库名
      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
        run: npm run build:pages

      # 前提：仓库已开启 Pages，且 Source 选择 "GitHub Actions"。
      # 注意 GITHUB_TOKEN 没有创建 / 修改 Pages 站点的权限，因此这一步无法由工作流代替，
      # 需要仓库所有者在 Settings → Pages 里手动设置一次。
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
