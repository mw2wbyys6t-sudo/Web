name: Deploy to GitHub Pages

on:
  # 推送到 main 时自动构建并部署
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 每天 21:00 UTC（北京时间次日 05:00）重新构建一次，顺带刷新星标 / 阅读数据
  schedule:
    - cron: "0 21 * * *"

# 部署到 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 抓取 GitHub 星标 / CSDN 阅读数据并写入 content/ 的 frontmatter。
      # 站点数据完全来自 frontmatter，所以构建阶段不需要联网。
      # 外部站点可能限流，失败时保留上一次的数据，不让部署挂掉。
      - name: Refresh stats from GitHub & CSDN
        run: npm run sync-stats
        continue-on-error: true

      # 只设置这一个变量即可：basePath 会根据 GITHUB_REPOSITORY 自动推导为 /仓库名
      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时尝试自动启用；若令牌权限不足，则需在
          # Settings → Pages → Source 手动选择 "GitHub Actions"
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
